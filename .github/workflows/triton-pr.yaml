name: Triton PR Pipeline

on:
  pull_request:
    branches: ["main"]

jobs:
  triton-pr-build-ut-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test deps
        run: python -m pip install --upgrade pip pytest

      - name: Generate Triton sample operator
        run: python scripts/generate_triton_sample.py

      - name: Compile generated operator
        run: python -m py_compile triton/operators/vector_add.py

      - name: Run unit tests
        run: pytest -q tests_triton

      - name: Run smoke test
        run: python triton/run_smoke.py
