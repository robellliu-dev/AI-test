name: Triton CI Pipeline

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  triton-ci-build-ut-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test deps
        run: python -m pip install --upgrade pip pytest

      - name: Generate Triton sample operator
        run: python scripts/generate_triton_sample.py

      - name: Compile generated operator
        run: python -m py_compile triton/operators/vector_add.py

      - name: Run unit tests
        run: pytest -q tests_triton

      - name: Run smoke test (CPU fallback)
        run: python triton/run_smoke.py

  gpu-smoke-optional:
    if: ${{ vars.ENABLE_GPU_SMOKE == 'true' }}
    runs-on: [self-hosted, linux, x64, gpu, nvidia]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies for GPU smoke
        run: |
          python -m pip install --upgrade pip
          python -m pip install triton

      - name: Generate Triton sample operator
        run: python scripts/generate_triton_sample.py

      - name: GPU smoke test
        run: python triton/run_smoke.py
